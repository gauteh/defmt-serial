[package]
name = "defmt-serial"
version = "0.14.0"
edition = "2024"
authors = [ "Gaute Hope <eg@gaute.vetsj.com>" ]
description = "Log defmt-messages over serial"
license = "MIT"
repository = "https://github.com/gauteh/defmt-serial"


[dependencies]
critical-section = "1.1"
defmt = "1.0"
embedded-io = "0.7"
portable-atomic = {version = "1.13", default-features = false}

[dev-dependencies]
cortex-m-rt = "0.7"
panic-probe = { version = "0.3", features = [ "print-defmt" ] }
cortex-m = "0.7"
static_cell = "2"

[dev-dependencies.ambiq-hal]
version = "0.3"
features = [ "ambiq-sdk", "sparkfun-redboard-nano", "rt"]
git = "https://github.com/gauteh/ambiq-rs"

[features]
# Include magic bytes to mix regular output with defmt when using espflash
espflash = []
